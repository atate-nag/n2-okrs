<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1:1 Hub — Direct Reports</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F7F8FB; --paper2:#EEF2F8; --card:#FFFFFF; --ink:#0F1419; --muted:#5B6573;
  --line:#E4E9F0; --line2:#CFD7E2; --gold:#2563EB; --goldbg:#EBF1FE; --goldline:#BFD3F8;
  --blue:#2563EB; --amber:#D97706; --red:#DC2626; --green:#10B981; --grey:#6B7280;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:14px;line-height:1.5}
.app{display:flex;min-height:100vh}

/* ---- sidebar ---- */
.side{width:248px;flex:0 0 248px;background:var(--paper2);border-right:1px solid var(--line2);
  position:sticky;top:0;height:100vh;overflow-y:auto;padding:20px 0}
.brand{padding:0 20px 16px;border-bottom:1px solid var(--line);margin-bottom:10px}
.brand h1{font-family:'Space Grotesk',Inter,sans-serif;font-weight:600;font-size:19px;margin:0;letter-spacing:-.01em}
.brand p{margin:3px 0 0;font-size:11.5px;color:var(--muted);font-family:"IBM Plex Mono",monospace;text-transform:uppercase;letter-spacing:.08em}
.plist{list-style:none;margin:0;padding:6px 10px}
.pitem{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;cursor:pointer;margin-bottom:2px;border:1px solid transparent}
.pitem:hover{background:#EAE3D2}
.pitem.active{background:var(--card);border-color:var(--line2);box-shadow:0 1px 2px rgba(0,0,0,.04)}
.dot{width:30px;height:30px;flex:0 0 30px;border-radius:50%;display:grid;place-items:center;
  font-family:'Space Grotesk',Inter,sans-serif;font-weight:600;font-size:13px;color:#fff}
.pmeta{min-width:0}
.pmeta .nm{font-weight:600;font-size:13.5px;line-height:1.2}
.pmeta .rl{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cur{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--muted)}
.sidefoot{padding:14px 20px;border-top:1px solid var(--line);margin-top:8px;font-size:11px;color:var(--muted)}
.sidefoot button{margin:3px 4px 0 0}

/* ---- main ---- */
.main{flex:1;min-width:0;padding:30px 38px 80px;max-width:1020px}
.head{display:flex;align-items:flex-start;gap:16px;border-bottom:1px solid var(--line2);padding-bottom:18px;margin-bottom:6px}
.head .dot{width:46px;height:46px;flex:0 0 46px;font-size:18px}
.head h2{font-family:'Space Grotesk',Inter,sans-serif;font-weight:600;font-size:27px;margin:0;letter-spacing:-.015em}
.head .sub{color:var(--muted);font-size:13px;margin-top:2px}
.head .sub b{color:var(--ink);font-weight:600}
.toolbar{margin-left:auto;display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;max-width:330px}
button{font-family:Inter,sans-serif;font-size:12px;background:var(--card);border:1px solid var(--line2);
  color:var(--ink);border-radius:7px;padding:6px 11px;cursor:pointer;transition:.12s}
button:hover{background:#fff;border-color:var(--gold)}
button.ghost{background:transparent}
.strip{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 26px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:8px 13px;min-width:74px}
.tile.gold{background:var(--goldbg);border-color:var(--goldline)}
.tile .n{font-family:'Space Grotesk',Inter,sans-serif;font-size:21px;font-weight:600;line-height:1}
.tile .l{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-top:3px;font-family:"IBM Plex Mono",monospace}

/* tabs */
.tabs{display:flex;flex-wrap:wrap;gap:2px;border-bottom:1px solid var(--line2);margin:18px 0 24px}
.tab{background:transparent;border:none;border-bottom:2px solid transparent;border-radius:0;
  padding:10px 15px;font-size:14px;color:var(--muted);font-weight:500;display:inline-flex;align-items:center;gap:8px}
.tab:hover{color:var(--ink);background:transparent;border-bottom-color:var(--line2)}
.tab.on{color:var(--ink);border-bottom-color:var(--gold);font-weight:600}
.tcount{font-family:"IBM Plex Mono",monospace;font-size:11px;background:var(--paper2);border:1px solid var(--line);
  border-radius:20px;padding:1px 7px;color:var(--muted);line-height:1.6}
.tab.on .tcount{background:var(--goldbg);border-color:var(--goldline);color:var(--gold)}
.panehd{display:flex;justify-content:flex-end;margin-bottom:14px}
.pane{min-height:200px}

.section{margin-bottom:34px}
.sechd{display:flex;align-items:baseline;gap:10px;margin:0 0 13px}
.secnum{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--gold);font-weight:500}
.sechd h3{font-family:'Space Grotesk',Inter,sans-serif;font-weight:600;font-size:17px;margin:0;letter-spacing:-.01em}
.sechd .add{margin-left:auto}

/* bonus */
.bonus{background:var(--goldbg);border:1px solid var(--goldline);border-radius:12px;padding:6px 16px 14px}
.brow{padding:12px 0;border-bottom:1px dashed var(--goldline)}
.brow:last-child{border-bottom:none}
.brow .label{font-weight:600;font-size:14.5px}
.brow .target{background:#fff;border:1px solid var(--goldline);border-radius:6px;padding:6px 10px;margin:6px 0;font-size:13px;font-family:"IBM Plex Mono",monospace}
.brow .note{font-size:12.5px;color:var(--muted);margin-top:4px}
.metarow{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin-top:6px;font-size:12px;color:var(--muted)}
.metarow .k{font-family:"IBM Plex Mono",monospace;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;margin-right:4px}

/* priorities */
.lane{margin-bottom:18px}
.lanehd{font-family:"IBM Plex Mono",monospace;font-size:11px;text-transform:uppercase;letter-spacing:.09em;
  color:var(--muted);margin:0 0 8px;display:flex;align-items:center;gap:8px}
.lanehd .bar{width:18px;height:3px;border-radius:2px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:13px 14px;position:relative}
.card .ctitle{font-weight:600;font-size:14px;padding-right:46px}
.card .cdetail{font-size:12.5px;color:#5d564b;margin-top:5px}
.card .corner{position:absolute;top:9px;right:9px;display:flex;gap:3px;opacity:0;transition:.12s}
.card:hover .corner{opacity:1}
.icon{width:22px;height:22px;border-radius:6px;border:1px solid var(--line2);background:#fff;cursor:pointer;
  font-size:11px;line-height:1;display:grid;place-items:center;color:var(--muted)}
.icon:hover{color:var(--ink);border-color:var(--gold)}

/* themes */
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.theme{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:13px 14px}
.theme .th{font-weight:600;font-size:13.5px}
.theme .lbl{font-family:"IBM Plex Mono",monospace;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-top:8px}
.theme .tx{font-size:12.5px;color:#5d564b;margin-top:2px}

/* log */
.log{border-left:2px solid var(--line2);padding-left:0;margin-left:4px}
.logrow{padding:11px 0 11px 18px;border-bottom:1px solid var(--line);position:relative}
.logrow:before{content:"";position:absolute;left:-5px;top:16px;width:8px;height:8px;border-radius:50%;background:var(--gold);border:2px solid var(--paper)}
.logrow.silent:before{background:var(--line2)}
.logrow.silent{opacity:.6}
.logdate{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--gold)}
.logrow.silent .logdate{color:var(--muted)}
.logtext{font-size:12.5px;margin-top:3px;white-space:pre-wrap}

/* shared bits */
.badge{font-family:"IBM Plex Mono",monospace;font-size:10.5px;padding:2px 7px;border-radius:20px;border:1px solid;cursor:pointer}
.b-open{color:var(--grey);border-color:var(--line2);background:#fff}
.b-prog{color:var(--blue);border-color:#bcd2df;background:#eef5f9}
.b-block{color:var(--red);border-color:#e2bcb0;background:#faeee9}
.b-mon{color:var(--amber);border-color:#e6cf9d;background:#fbf2dd}
.b-done{color:var(--green);border-color:#bcd3b0;background:#eef4e9}
[contenteditable]{outline:none;border-radius:4px}
[contenteditable]:hover{background:#fff8e9}
[contenteditable]:focus{background:#fff;box-shadow:0 0 0 2px var(--goldline)}
select{font-family:"IBM Plex Mono",monospace;font-size:11px;border:1px solid var(--line2);border-radius:6px;
  background:#fff;color:var(--ink);padding:2px 4px;cursor:pointer}
.muted{color:var(--muted)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;
  padding:10px 18px;border-radius:9px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:50}
.toast.show{opacity:1}
.mtoggle{display:none}
@media(max-width:860px){
  .side{position:fixed;left:0;top:0;z-index:40;transform:translateX(-100%);transition:.2s}
  .side.open{transform:none}
  .main{padding:18px 16px 70px}
  .mtoggle{display:inline-block;position:fixed;top:12px;left:12px;z-index:45}
  .toolbar{max-width:none}
}
@media print{
  .side,.toolbar,.corner,.add,.sidefoot,.mtoggle{display:none!important}
  .main{max-width:none;padding:0}
  .card,.theme,.bonus{break-inside:avoid}
}

/* ---- PIN overlay ---- */
#pin-overlay{position:fixed;inset:0;background:var(--paper);z-index:9999;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px;}
#pin-overlay.hidden{display:none;}
#pin-overlay h2{font-family:'Space Grotesk',Inter,sans-serif;font-weight:500;font-size:22px;color:var(--ink);margin:0;letter-spacing:-.01em;}
#pin-overlay .sub{color:var(--muted);font-size:13px;margin-top:-10px;}
#pin-overlay input{font-family:'IBM Plex Mono',monospace;font-size:22px;text-align:center;letter-spacing:8px;width:220px;padding:12px;border:1px solid var(--line2);border-radius:8px;background:var(--card);color:var(--ink);outline:none;}
#pin-overlay input:focus{border-color:var(--gold);}
#pin-overlay .pin-error{color:var(--red);font-size:13px;min-height:18px;}
#pin-overlay button{padding:9px 28px;border:none;border-radius:8px;background:var(--ink);color:var(--paper);font-size:14px;font-weight:500;cursor:pointer;font-family:inherit;}

/* ---- chunkier + brighter overrides ---- */
body{font-size:15px}
.head h2{font-size:30px;font-weight:700;letter-spacing:-.02em}
.brand h1{font-size:21px;font-weight:700;letter-spacing:-.015em}
.pitem{padding:11px 12px;border-radius:10px;border-width:2px;border-color:transparent}
.pitem:hover{background:#E1E8F2}
.pitem.active{background:var(--card);border-color:var(--line2);box-shadow:0 1px 3px rgba(15,20,25,.06)}
.pmeta .nm{font-size:14.5px;font-weight:600}
.card,.theme{border-width:2px;border-radius:14px;padding:16px 18px}
.card .ctitle{font-size:14.5px}
.bonus{border-width:2px;border-radius:14px;padding:10px 20px 18px}
.brow{padding:14px 0}
.brow .label{font-size:15.5px;font-weight:700}
.brow .target{font-size:13px;padding:7px 11px;border-radius:8px;border-width:2px}
button{padding:8px 14px;font-size:13px;border-width:2px;font-weight:500;border-radius:9px}
.tab{padding:11px 16px;font-size:14.5px;font-weight:600;border-bottom-width:3px}
.tab.on{font-weight:700}
.badge{font-size:11.5px;padding:3px 10px;font-weight:600;border-width:2px}
.tile{border-width:2px;border-radius:12px;padding:10px 14px}
.tile .n{font-weight:700}
.icon{width:24px;height:24px;border-width:2px}
[contenteditable]:hover{background:var(--goldbg)}
[contenteditable]:focus{background:#fff;box-shadow:0 0 0 2px var(--gold)}
select{padding:4px 7px;font-size:12px;border-width:2px;border-radius:7px}

/* ---- section label inside Goals tab ---- */
.seclbl{display:flex;align-items:center;gap:10px;margin:0 0 10px}
.seclbl-text{font-family:'Space Grotesk',Inter,sans-serif;font-weight:700;font-size:15px;letter-spacing:-.01em;color:var(--ink)}
.seclbl .add{margin-left:auto}

/* ---- progress / confidence pills ---- */
.kpi{display:inline-flex;align-items:center;gap:10px;margin-left:auto}
.kpi .group{display:inline-flex;align-items:center;gap:5px}
.kpi .k{font-family:"IBM Plex Mono",monospace;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.metric{display:inline-block;min-width:54px;height:30px;line-height:30px;border-radius:8px;text-align:center;
  font-family:"IBM Plex Mono",monospace;font-size:12.5px;font-weight:600;padding:0 8px;border:2px solid transparent;cursor:text}
.tl-green{background:#D1FAE5;color:#065F46;border-color:#A7F3D0}
.tl-amber{background:#FEF3C7;color:#92400E;border-color:#FCD86E}
.tl-red{background:#FEE2E2;color:#991B1B;border-color:#FCA5A5}
.tl-grey{background:#F3F4F6;color:#6B7280;border-color:#E5E7EB}

/* ---- manager-only inline member-PIN editor (header) ---- */
.pin-field{display:inline-flex;align-items:center;gap:7px;margin-left:10px;padding:3px 10px;background:var(--goldbg);
  border:2px solid var(--goldline);border-radius:8px;font-size:11.5px;color:var(--gold);vertical-align:middle}
.pin-field .pf-label{font-family:"IBM Plex Mono",monospace;text-transform:uppercase;letter-spacing:.06em;font-size:10px;font-weight:600}
.pin-field [contenteditable]{font-family:"IBM Plex Mono",monospace;font-size:12.5px;font-weight:700;color:var(--ink);letter-spacing:1.5px;background:#fff;padding:1px 7px;border-radius:5px;min-width:70px;display:inline-block;text-align:center}

/* ---- member view-only mode (set on body when a member PIN unlocks) ---- */
body.viewonly [contenteditable]{pointer-events:none}
body.viewonly [contenteditable]:hover,
body.viewonly [contenteditable]:focus{background:transparent;box-shadow:none}
body.viewonly .add,
body.viewonly button.icon,
body.viewonly .toolbar button,
body.viewonly .pin-field,
body.viewonly .sidefoot button,
body.viewonly select{display:none!important}
body.viewonly .side .plist{pointer-events:none}
body.viewonly .metric{cursor:default}

/* ---- Challenge Map tab (CBS visualisation) ---- */
.cmap{
  --cm-paper:#E7EAE5; --cm-paper2:#DDE1DA; --cm-ink:#15242C; --cm-ink-soft:#3a4a52;
  --cm-faint:rgba(21,36,44,.10); --cm-fainter:rgba(21,36,44,.055);
  --cm-line:rgba(21,36,44,.28);
  background:var(--cm-paper); color:var(--cm-ink);
  border:1.5px solid var(--cm-ink); border-radius:4px;
  padding:24px clamp(16px,3vw,32px) 32px;
  font-family:Inter,system-ui,sans-serif;
}
.cmap .masthead{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;border-bottom:1.5px solid var(--cm-ink);padding-bottom:14px;margin-bottom:0;}
.cmap .title-wrap h3{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:clamp(22px,3.4vw,34px);letter-spacing:-.02em;line-height:.98;margin:0;color:var(--cm-ink);}
.cmap .title-wrap h3 .v{font-size:.42em;vertical-align:super;color:#BB463C;font-weight:600;letter-spacing:0;}
.cmap .title-wrap .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.32em;text-transform:uppercase;color:var(--cm-ink-soft);margin:0 0 8px;}
.cmap .meta{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--cm-ink-soft);text-align:right;line-height:1.7;white-space:nowrap;}
.cmap .meta b{color:var(--cm-ink);font-weight:600}
.cmap .strip{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--cm-faint);border:1px solid var(--cm-faint);border-top:none;margin-bottom:20px;}
.cmap .stat{background:var(--cm-paper);padding:10px 13px}
.cmap .stat .k{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--cm-ink-soft);margin-bottom:5px}
.cmap .stat .v{font-family:'Space Grotesk',sans-serif;font-size:14px;font-weight:600;line-height:1.15;color:var(--cm-ink);}
.cmap .stat .v small{font-family:'IBM Plex Mono',monospace;font-size:9.5px;font-weight:400;color:var(--cm-ink-soft);display:block;margin-top:3px}
@media(max-width:720px){.cmap .strip{grid-template-columns:repeat(2,1fr)}}
.cmap .axes-note{font-size:12.5px;color:var(--cm-ink-soft);max-width:780px;margin:0 0 20px;line-height:1.55;}
.cmap .axes-note b{color:var(--cm-ink);font-weight:600}
.cmap .stage{display:grid;grid-template-columns:1fr 320px;gap:22px;align-items:start}
@media(max-width:920px){.cmap .stage{grid-template-columns:1fr}}
.cmap .field-wrap{position:relative;background:var(--cm-paper2);border:1.5px solid var(--cm-ink);border-radius:3px;overflow:hidden;}
.cmap svg.field{display:block;width:100%;height:auto}
.cmap .axis-cap{position:absolute;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--cm-ink-soft);pointer-events:none;}
.cmap .axis-y{left:9px;top:50%;transform:translateY(-50%) rotate(-90deg);transform-origin:left center}
.cmap .cap-x-left{left:50px;bottom:9px}
.cmap .cap-x-right{right:14px;bottom:9px}
.cmap .node{cursor:pointer}
.cmap .node .halo{opacity:0;transition:opacity .18s}
.cmap .node circle.dot{transition:filter .18s}
.cmap .node text{font-family:'IBM Plex Mono',monospace;font-weight:600;pointer-events:none}
.cmap .node:hover circle.dot,.cmap .node.active circle.dot{filter:brightness(1.08)}
.cmap .node:hover .halo,.cmap .node.active .halo,.cmap .node:focus .halo{opacity:1}
.cmap .node:focus{outline:none}
.cmap .badge{font-family:'IBM Plex Mono',monospace;font-weight:600;fill:var(--cm-ink-soft)}
.cmap .edge{stroke:var(--cm-line);stroke-width:1.2;fill:none;transition:stroke .18s,stroke-width .18s,opacity .18s}
.cmap .edge.dim{opacity:.16}
.cmap .edge.lit{stroke-width:2.4;opacity:1}
.cmap .reinf{fill:none;stroke:#BB463C;stroke-width:2.2;stroke-dasharray:1 6;stroke-linecap:round;opacity:.8;transition:opacity .18s,stroke-width .18s}
.cmap .reinf.dim{opacity:.4}
.cmap .reinf.lit{stroke-width:3.2;opacity:1}
.cmap .reinf-lab{font-family:'IBM Plex Mono',monospace;font-size:10px;fill:#BB463C;letter-spacing:.08em}
.cmap .qlabel{font-family:'IBM Plex Mono',monospace;font-size:11px;fill:var(--cm-ink-soft);letter-spacing:.12em;text-transform:uppercase}
.cmap .readout{border:1.5px solid var(--cm-ink);border-radius:3px;background:var(--cm-paper2);min-height:540px;display:flex;flex-direction:column;}
.cmap .readout-head{display:flex;justify-content:space-between;align-items:center;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:var(--cm-ink-soft);padding:11px 14px;border-bottom:1px solid var(--cm-faint);}
.cmap .dot-live{width:7px;height:7px;border-radius:50%;background:var(--cm-ink-soft);display:inline-block;margin-left:8px}
.cmap .readout-body{padding:16px 16px 18px;flex:1;color:var(--cm-ink);}
.cmap .legend-row{display:flex;align-items:center;gap:9px;font-size:12.5px;margin-bottom:9px}
.cmap .swatch{width:13px;height:13px;border-radius:50%;flex:none}
.cmap .swatch.hollow{background:transparent;border:1.6px dashed #B07A2E}
.cmap .legend-row b{font-weight:600}
.cmap .helptext{font-size:12px;color:var(--cm-ink-soft);line-height:1.55;margin:14px 0 0;border-top:1px solid var(--cm-faint);padding-top:14px}
.cmap .helptext b{color:var(--cm-ink)}
.cmap .rank-title{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--cm-ink-soft);margin:18px 0 9px;border-top:1px solid var(--cm-faint);padding-top:14px}
.cmap .rank{list-style:none;margin:0;padding:0}
.cmap .rank li{display:flex;gap:10px;align-items:baseline;font-size:12.5px;padding:5px 0;cursor:pointer;border-bottom:1px solid var(--cm-fainter);line-height:1.3;color:var(--cm-ink);}
.cmap .rank li:hover{color:#BB463C}
.cmap .rank li .seq{font-family:'IBM Plex Mono',monospace;color:var(--cm-ink-soft);font-size:11px;min-width:16px}
.cmap .rank li .code{font-family:'IBM Plex Mono',monospace;font-weight:600;min-width:26px}
.cmap .d-code{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:13px}

/* ============ STATE + STORAGE (graceful fallback) ============ */
const KEY="team-1to1-hub-v1";
let DATA, current=0, activeTab="priorities";
function clone(o){return JSON.parse(JSON.stringify(o));}
async function load(){
  // URL hash wins (snapshot share), then Supabase, then localStorage cache, then seed
  try{ if(location.hash.length>1){ const d=decodeState(location.hash.slice(1)); if(d&&d.people){return d;} } }catch(e){}
  try{ const row = await sbFetch(); if(row && row.data && row.data.people) return row.data; }
  catch(e){ console.warn('Supabase fetch failed, using local fallback:', e); }
  try{ const s=localStorage.getItem(KEY); if(s){const d=JSON.parse(s); if(d&&d.people){return d;}} }catch(e){}
  return clone(SEED);
}
function persist(){
  DATA.updatedAt=new Date().toISOString();
  try{ localStorage.setItem(KEY,JSON.stringify(DATA)); }catch(e){}
  renderStamp();
  // debounced Supabase save: rapid edits coalesce into one network round-trip
  if (saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{ saveTimer = null; sbSave(); }, 800);
}
function decodeState(b64){ return JSON.parse(decodeURIComponent(escape(atob(b64)))); }
function encodeState(obj){ return btoa(unescape(encodeURIComponent(JSON.stringify(obj)))); }

function importJSON(ev){
  const f=ev.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{
    const d=JSON.parse(r.result);
    if(d.people){DATA=d;current=0;}                       // full hub file
    else if(d.id&&d.items){                               // single-person file
      const idx=DATA.people.findIndex(x=>x.id===d.id);
      if(idx>=0){DATA.people[idx]=d;current=idx;} else {DATA.people.push(d);current=DATA.people.length-1;}
    } else {toast("Unrecognised file");return;}
    persist();render();toast("Imported");
  }catch(e){toast("Import failed — invalid JSON");}};
  r.readAsText(f);ev.target.value="";
}

      </aside>
    </div>
    ${cm.footnote_html?`<p class="footnote">${cm.footnote_html}</p>`:''}
  </div>`;

  // SVG construction (ported from EoD_Challenge_Map_v2.html)
  const NODES = cm.nodes||[], EDGES = cm.edges||[], REINF = cm.reinf||[], RANK = cm.rank||[];
  const CLASS = cm.classes || {};
  const VB={w:1000,h:720}, M={t:46,r:46,b:62,l:64};
  const PW=VB.w-M.l-M.r, PH=VB.h-M.t-M.b;
  const px=a=>M.l+(a/100)*PW, py=i=>M.t+(1-i/100)*PH;
  const NS='http://www.w3.org/2000/svg';
  const el=(n,a)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);return e;};
  const byCode={}; NODES.forEach(n=>byCode[n.code]=n);
  const svg=document.getElementById('cmap-field');

  // grid + quadrants
  const gGrid=el('g',{}); svg.appendChild(gGrid);
  for(let v=0;v<=100;v+=10){
    gGrid.appendChild(el('line',{x1:px(v),y1:M.t,x2:px(v),y2:M.t+PH,stroke:'rgba(21,36,44,0.06)','stroke-width':1}));
    gGrid.appendChild(el('line',{x1:M.l,y1:py(v),x2:M.l+PW,y2:py(v),stroke:'rgba(21,36,44,0.06)','stroke-width':1}));
  }
  gGrid.appendChild(el('line',{x1:px(50),y1:M.t,x2:px(50),y2:M.t+PH,stroke:'rgba(21,36,44,0.22)','stroke-width':1,'stroke-dasharray':'2 5'}));
  gGrid.appendChild(el('line',{x1:M.l,y1:py(50),x2:M.l+PW,y2:py(50),stroke:'rgba(21,36,44,0.22)','stroke-width':1,'stroke-dasharray':'2 5'}));
  gGrid.appendChild(el('rect',{x:M.l,y:M.t,width:PW,height:PH,fill:'none',stroke:'rgba(21,36,44,0.35)','stroke-width':1.2}));
  function qlab(x,y,t,a){const e=el('text',{x,y,'text-anchor':a||'start'});e.setAttribute('class','qlabel');e.textContent=t;svg.appendChild(e);}
  qlab(M.l+PW-8,M.t+18,'Move now','end');
  qlab(M.l+8,M.t+18,'Hard but decisive','start');
  qlab(M.l+PW-8,M.t+PH-10,'Easy · opportunistic','end');
  qlab(M.l+8,M.t+PH-10,'Watch · park','start');

  // edges
  const gEdges=el('g',{}); svg.appendChild(gEdges);
  const edgeEls=[];
  EDGES.forEach(([a,b])=>{
    const na=byCode[a], nb=byCode[b]; if(!na||!nb) return;
    const ln=el('line',{x1:px(na.addr),y1:py(na.impact),x2:px(nb.addr),y2:py(nb.impact)});
    ln.setAttribute('class','edge'); ln.dataset.a=a; ln.dataset.b=b;
    gEdges.appendChild(ln); edgeEls.push(ln);
  });
  // reinforcing loop (curved)
  let reinfPath=null;
  if (REINF.length===2 && byCode[REINF[0]] && byCode[REINF[1]]) {
    const ra=byCode[REINF[0]], rb=byCode[REINF[1]];
    const x1=px(ra.addr),y1=py(ra.impact),x2=px(rb.addr),y2=py(rb.impact);
    const mx=(x1+x2)/2,my=(y1+y2)/2,dx=x2-x1,dy=y2-y1,len=Math.hypot(dx,dy)||1;
    const off=46, cx=mx+(-dy/len)*off, cy=my+(dx/len)*off;
    reinfPath=el('path',{d:`M ${x1} ${y1} Q ${cx} ${cy} ${x2} ${y2}`}); reinfPath.setAttribute('class','reinf');
    gEdges.appendChild(reinfPath);
    const bx=0.25*x1+0.5*cx+0.25*x2, by=0.25*y1+0.5*cy+0.25*y2;
    const reinfLab=el('text',{x:bx+8,y:by,'text-anchor':'start'}); reinfLab.setAttribute('class','reinf-lab'); reinfLab.textContent='↻ reinforces'; svg.appendChild(reinfLab);
  }

  // nodes
  const gNodes=el('g',{}); svg.appendChild(gNodes);
  const nodeEls={};
  NODES.forEach(n=>{
    const x=px(n.addr), y=py(n.impact), r=15+n.impact*0.11;
    const col=(CLASS[n.cls]||{color:'#888'}).color, hollow=(n.cls==='lever');
    const g=el('g',{tabindex:0,role:'button','aria-label':n.code+' '+n.title}); g.setAttribute('class','node'); g.dataset.code=n.code;
    g.appendChild(el('circle',{class:'halo',cx:x,cy:y,r:r+8,fill:'none',stroke:col,'stroke-width':1.4,'stroke-opacity':.5}));
    const dot=el('circle',{class:'dot',cx:x,cy:y,r:r,fill:hollow?'#DDE1DA':col,stroke:col,'stroke-width':hollow?2:0});
    if(hollow) dot.setAttribute('stroke-dasharray','3 3');
    g.appendChild(dot);
    const t=el('text',{x:x,y:y+4,'text-anchor':'middle','font-size':n.cls==='lever'?12:13,fill:hollow?col:'#F2F4F0'}); t.textContent=n.code; g.appendChild(t);
    if(n.changed){const bd=el('text',{x:x+r+3,y:y-r+2,'font-size':12}); bd.setAttribute('class','badge'); bd.textContent='Δ'; g.appendChild(bd);}
    gNodes.appendChild(g); nodeEls[n.code]=g;
    g.addEventListener('mouseenter',()=>cmapHover(n.code));
    g.addEventListener('mouseleave',()=>{if(!cmapPinned)cmapClearHover();});
    g.addEventListener('click',()=>cmapSelect(n.code));
    g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();cmapSelect(n.code);}});
  });

  let cmapPinned=null;
  const body=document.getElementById('cmap-body');
  const live=document.getElementById('cmap-live');
  const isReinf=code=>REINF.includes(code);

  function litEdges(code){
    edgeEls.forEach(ln=>{
      const on = ln.dataset.a===code || ln.dataset.b===code;
      ln.classList.toggle('lit',on); ln.classList.toggle('dim',!on);
      if(on) ln.setAttribute('stroke',(CLASS[byCode[code].cls]||{color:'#888'}).color);
    });
    if(reinfPath){ reinfPath.classList.toggle('lit',isReinf(code)); reinfPath.classList.toggle('dim',!isReinf(code)); }
    Object.entries(nodeEls).forEach(([c,g])=>g.classList.toggle('active',c===code));
  }
  function clearLit(){
    edgeEls.forEach(ln=>{ln.classList.remove('lit','dim');ln.removeAttribute('stroke');});
    if(reinfPath){ reinfPath.classList.remove('lit','dim'); }
    Object.values(nodeEls).forEach(g=>g.classList.remove('active'));
  }
  function cmapHover(code){ if(cmapPinned)return; litEdges(code); renderDetail(code,false); live.innerHTML=code+' · live<span class="dot-live" style="background:'+(CLASS[byCode[code].cls]||{color:'#888'}).color+'"></span>'; }
  function cmapClearHover(){ clearLit(); renderDefault(); live.innerHTML='— standby<span class="dot-live"></span>'; }
  function cmapSelect(code){ if(cmapPinned===code){cmapPinned=null;cmapClearHover();return;} cmapPinned=code; litEdges(code); renderDetail(code,true); live.innerHTML=code+' · pinned<span class="dot-live" style="background:'+(CLASS[byCode[code].cls]||{color:'#888'}).color+'"></span>'; }

  function renderDefault(){
    const helptext = cm.helptext_html || '';
    body.innerHTML=`
      <div class="legend-row"><span class="swatch" style="background:${(CLASS.critical||{}).color||'#888'}"></span><span><b>Critical</b> — binding constraint</span></div>
      <div class="legend-row"><span class="swatch" style="background:${(CLASS.opportunity||{}).color||'#888'}"></span><span><b>Opportunity</b> — client-pulled lever</span></div>
      <div class="legend-row"><span class="swatch" style="background:${(CLASS.foundational||{}).color||'#888'}"></span><span><b>Foundational</b> — bounds/informs strategy</span></div>
      <div class="legend-row"><span class="swatch hollow"></span><span><b>Lever / option</b> — candidate move to test</span></div>
      ${helptext?`<p class="helptext">${helptext}</p>`:''}
      ${RANK.length?`<div class="rank-title">Suggested sequence</div><ol class="rank" id="cmap-rank"></ol>`:''}`;
    const ol=document.getElementById('cmap-rank');
    if (ol) RANK.forEach((c,i)=>{
      const n=byCode[c]; if(!n) return;
      const li=document.createElement('li');
      li.innerHTML=`<span class="seq">${String(i+1).padStart(2,'0')}</span><span class="code" style="color:${(CLASS[n.cls]||{}).color||'#888'}">${c}</span><span>${esc(n.title)}</span>`;
      li.addEventListener('mouseenter',()=>{if(!cmapPinned)litEdges(c);});
      li.addEventListener('mouseleave',()=>{if(!cmapPinned)clearLit();});
      li.addEventListener('click',()=>cmapSelect(c));
      ol.appendChild(li);
    });
  }
  function renderDetail(code,pin){
    const n=byCode[code]; if(!n) return;
    const col=(CLASS[n.cls]||{color:'#888'}).color;
    body.innerHTML=`
      <div style="display:flex;align-items:center;flex-wrap:wrap">
        <span class="d-code" style="color:${col}">${n.code}</span>
        <span class="chip" style="background:${col}">${esc((CLASS[n.cls]||{}).name||n.cls)}</span>
        ${n.changed?'<span class="chip delta">Δ updated</span>':''}
        ${pin?'<button class="clear-btn" id="cmap-unpin">✕ unpin</button>':''}
      </div>
      <div class="d-title">${esc(n.title)}</div>
      <div class="gauges">
        <div class="gauge"><div class="lab"><span>${n.cls==='lever'?'Potential':'Impact'}</span><b>${n.impact}</b></div><div class="track"><div class="fill" data-w="${n.impact}" style="background:${col}"></div></div></div>
        <div class="gauge"><div class="lab"><span>${n.cls==='lever'?'Feasibility':'Addressability'}</span><b>${n.addr}</b></div><div class="track"><div class="fill" data-w="${n.addr}" style="background:${col}"></div></div></div>
      </div>
      <p class="d-desc">${esc(n.desc)}</p>
      <div class="q-block"><div class="qlab">${n.cls==='lever'?'Open question':'Decision it forces'}</div><div class="qtext">${esc(n.q)}</div></div>
      <div class="links"><div class="qlab">${n.cls==='lever'?'Acts on':'Linked challenges'}</div><div id="cmap-linkwrap"></div></div>`;
    requestAnimationFrame(()=>body.querySelectorAll('.fill').forEach(f=>f.style.width=f.dataset.w+'%'));
    const lw=document.getElementById('cmap-linkwrap');
    (n.links||[]).forEach(c=>{
      const m=byCode[c]; if(!m) return;
      const b=document.createElement('button'); b.className='linkchip';
      b.innerHTML=`<span class="lc-code" style="color:${(CLASS[m.cls]||{}).color||'#888'}">${c}</span> ${esc(m.title)}`;
      b.addEventListener('mouseenter',()=>litEdges(c));
      b.addEventListener('mouseleave',()=>litEdges(code));
      b.addEventListener('click',()=>cmapSelect(c));
      lw.appendChild(b);
    });
    if(pin){const u=document.getElementById('cmap-unpin'); if(u)u.addEventListener('click',()=>{cmapPinned=null;cmapClearHover();});}
  }

  renderDefault();
}

/* ============ BOOT ============ */
async function initApp(memberId){
  DATA = await load();
  if(!DATA.version) DATA.version = "unified-v1";
  if (memberId) {
    const idx = DATA.people.findIndex(pp => pp.id === memberId);
    if (idx >= 0) { current = idx; document.body.classList.add('viewonly'); }
  }
  render(); renderStamp();
}
window.addEventListener("hashchange",()=>{try{const d=decodeState(location.hash.slice(1));if(d&&d.people){DATA=d;current=0;render();toast("Loaded from link");}}catch(e){}});
{
  const session = sessionStorage.getItem('sltpin');
  if (session === '1' || session === 'manager') {
    document.getElementById('pin-overlay').classList.add('hidden');
    initApp();
  } else if (session && session.startsWith('member:')) {
    document.getElementById('pin-overlay').classList.add('hidden');
    initApp(session.slice(7));
  }
}
</script>
